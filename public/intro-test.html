<!doctype html><meta name='viewport' content='width=device-width,initial-scale=1'><style>
html,body{margin:0;background:#020504}.intro{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#020504}.visual{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}.img{width:min(100vw,682px);height:auto;opacity:0;transition:opacity 820ms ease}.img.ready{opacity:1}.cover{position:absolute;z-index:2;left:0;right:0;top:clamp(112px,15.5vh,158px);bottom:0;background:#000;opacity:1;transition:opacity 1350ms ease-in-out}.reveal .cover{opacity:0}
</style><main id='s' class='intro'><div class='visual'><img id='i' class='img' src='/assets/intro/orsia-descent.webp'></div><div class='cover'></div></main><script>const i=document.querySelector('#i'),s=document.querySelector('#s');i.onload=()=>{i.classList.add('ready');setTimeout(()=>s.classList.add('reveal'),2000)}</script>
